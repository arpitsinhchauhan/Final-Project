<div class="card shadow-sm nozzle-sales-card">
    <div class="card-header card-header-warning d-flex justify-content-between align-items-center">
        <div>
            <h4 class="card-title m-0">Nozzle Sales Overview</h4>
            <p class="card-category m-0 opacity-75">Performance tracking</p>
        </div>
        <div class="d-flex align-items-center">
            <mat-button-toggle-group [(ngModel)]="filterType"
                (change)="filterTypeChange.emit(filterType); filterChange.emit()" appearance="legacy"
                class="filter-toggle-group-small mr-2">
                <mat-button-toggle value="today">Day</mat-button-toggle>
                <mat-button-toggle value="month">Month</mat-button-toggle>
                <mat-button-toggle value="year">Year</mat-button-toggle>
                <mat-button-toggle value="fy">FY</mat-button-toggle>
            </mat-button-toggle-group>

            <mat-form-field *ngIf="filterType === 'fy'" appearance="outline" class="year-select-small no-padding">
                <mat-select [(ngModel)]="selectedYear"
                    (selectionChange)="selectedYearChange.emit(selectedYear); filterChange.emit()">
                    <mat-option *ngFor="let year of yearList" [value]="year">
                        {{year}}-{{year+1}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <i class="material-icons ml-2">local_gas_station</i>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="text-secondary text-uppercase small font-weight-bold">
                    <tr>
                        <th class="border-0 pl-4">Nozzle</th>
                        <th class="border-0">Fuel Type</th>
                        <th class="border-0 text-right">Liters</th>
                        <th class="border-0 text-right pr-4">Amount (₹)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let nozzle of nozzleSales" class="align-middle">
                        <td class="pl-4 font-weight-bold">{{ nozzle.nozzleName }}</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <span class="fuel-indicator mr-2"
                                    [style.background-color]="getFuelColor(nozzle.fuelType)"></span>
                                {{ nozzle.fuelType }}
                            </div>
                        </td>
                        <td class="text-right text-muted font-weight-500">{{ nozzle.liters | number:'1.2-2' }}</td>
                        <td class="text-right font-weight-bold text-success pr-4">
                            ₹{{ nozzle.amount | number:'1.2-2' }}
                        </td>
                    </tr>
                    <tr *ngIf="nozzleSales.length === 0">
                        <td colspan="4" class="text-center py-4 text-muted">
                            No sales recorded for today
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
