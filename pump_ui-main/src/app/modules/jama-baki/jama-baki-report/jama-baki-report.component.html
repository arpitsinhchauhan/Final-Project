<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
        <div class="card">
            <div class="card-header card-header-danger">
                <h4 class="card-title">Jama $ Baki</h4>
            </div>
            <div class="card-body">
                <div style="display:inline;width:100%">
                    <div class="col-md-6" style="display: flex; align-items: center; gap: 10px;">
                        <mat-form-field style="flex: 1;">
                            <input matInput [(ngModel)]="purchaDipStockseDetails.date" type="date">
                        </mat-form-field>

                        <button class="nav-link me-2" (click)="AddCustomer()" title="Add Customer">
                            <i class="material-icons">person_add</i>
                        </button>
                    </div>

                    <div style="display:inline;">
                        <button (click)="addTable()">Add Row</button>
                    </div>
                    <div style="display:inline;margin-left:25%">
                        <button (click)="cancel()">cancel</button>
                        <button (click)="order()">Add</button>
                    </div>
                </div>
                <br />
                <table class="style">
                    <tr>
                        <!-- <th style="width: 16%;">idJamabaki</th> -->
                        <th>Name</th>
                        <th *ngIf="jamaBaki.type !== 'baki'">Jama</th>
                        <th *ngIf="jamaBaki.type !== 'baki'">Note</th>
                        <th *ngIf="jamaBaki.type !== 'jama'">Type</th>
                        <th *ngIf="jamaBaki.type !== 'jama'">LTR</th>
                        <th *ngIf="jamaBaki.type !== 'jama'">Rate</th>
                        <th *ngIf="jamaBaki.type !== 'jama'">Baki</th>
                        <th *ngIf="jamaBaki.type !== 'jama'">Note</th>
                        <th *ngIf="jamaBaki.type !== 'jama'">Bill_Baki</th>
                        <th></th>
                    </tr>
                    <tr *ngFor="let item of row; let i = index">
                        <!-- <td><input style="text-align: center;" type="text" [(ngModel)]="item.idJamabaki" /></td> -->
                        <td>
                            <mat-form-field style="margin-top: 4%; background-color: rgb(252, 252, 252); width: 100%;">
                                <mat-label>Customer</mat-label>
                                <mat-select [(ngModel)]="item.customer" [compareWith]="compareCustomers"
                                    (openedChange)="onReceiverOpened()" [displayWith]="displayCustomerName">

                                    <mat-option disabled>
                                        <div class="search-box">
                                            <span class="search-icon">🔍</span>
                                            <input type="text" placeholder="Search..." [(ngModel)]="receiverSearch"
                                                (ngModelChange)="filterReceivers()" class="search-input" />
                                        </div>
                                    </mat-option>

                                    <mat-option *ngFor="let customer of filteredNames" [value]="customer">
                                        {{ customer.name }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>


                        </td>

                        <td *ngIf="jamaBaki.type !== 'baki'">
                            <input type="text" [(ngModel)]="item.jama" style="background-color: skyblue;" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'baki'">
                            <input type="text" [(ngModel)]="item.jamaNote" />
                        </td>

                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <mat-form-field appearance="fill" class="table-select">
                                <mat-label>Select an option</mat-label>
                                <mat-select [(ngModel)]="item.type" disableRipple>
                                    <mat-option *ngFor="let type of petrolTypeList" [value]="type">
                                        {{ type }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </td>
                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <input type="number" [(ngModel)]="item.ltr" (input)="calculateBaki(item)"
                                placeholder="Ltr" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <input type="number" [(ngModel)]="item.rate" (input)="calculateBaki(item)"
                                placeholder="Rate" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <input type="text" [(ngModel)]="item.baki" [value]="item.baki" readonly
                                style="background-color: indianred;" placeholder="Baki" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <input type="text" [(ngModel)]="item.bakiNote" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <button (click)="billBaki(item,i)"><i class="fa fa-file-pdf-o"></i></button>
                        </td>
                        <td>
                            <button (click)="deleteRow(i)"><i class="fa fa-trash"></i></button>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">Total:</td>
                        <td *ngIf="jamaBaki.type !== 'baki'">
                            <input type="text" [value]="totalJama()" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'baki'"></td>
                        <td *ngIf="jamaBaki.type !== 'jama'">
                            <input type="text" [value]="totalBaki()" />
                        </td>
                        <td *ngIf="jamaBaki.type !== 'jama'"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
