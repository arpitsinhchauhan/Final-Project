jwt.secret=${JWT_SECRET:your-default-secret}
jwt.expirationDateInMs=3600000

spring.datasource.url=jdbc:mysql://localhost:3306/managment?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
server.port=8081
server.error.include-stacktrace=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jasper.template.path=report2.jasper

twilio.accountSid=${TWILIO_ACCOUNT_SID}
twilio.authToken=${TWILIO_AUTH_TOKEN}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER}

mailjet.apikey=${MAILJET_API_KEY}
mailjet.secretKey=${MAILJET_SECRET_KEY}
